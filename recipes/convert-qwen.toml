# Qwen3.5-0.8B-Base converted to ternary (streaming GPTQ on centred inputs), then TTF on Wikipedia retokenised for Qwen
# (scripts/quant/retok.py), 400 steps x 16 x 2048 (13M tokens): q08c_base (16 Oct), training-time val 3.1388.
# Continuing it at theta 16 with the adapters grown to rank 64 (--resume --ttf-theta 16 --ttf-acc-scale 0.25
# --adapter-rank 64 --lr-rewarm 401:20:0.5 --steps 800) gave 3.0012 (q08c_c16z64).
#   python -m ttf.train --recipe convert-qwen --init-hf $HF/Qwen3.5-0.8B-Base --out-dir runs/convert-qwen
mode = "ttf"
convert = "gptqc"
data = "data/wikiqw_train40.bin"
val = "data/wikiqw_val.bin"
data-dtype = "u32"
seq-len = 2048
batch-size = 4
accum = 4
steps = 400
warmup = 40
lr = 5e-4
min-lr = 5e-5
eval-interval = 100
eval-iters = 8
save-secs = 99999
qk-temp = false
ttf-rank = 256
ttf-theta = 64
mem-cap-gib = 15
