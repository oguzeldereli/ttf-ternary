# Qwen3.8-27B (the released ternary checkpoint qw27_rel, step 1350) continued with KD from cached teacher top-k targets.
# 2 x 8 micro-batches for a 24 GB GPU (68.9 s per step on a 3090 Ti); a 32 GB card (RTX 5090) takes --batch-size 4
# --accum 4 (30.1 s per step) with --mem-cap-gib 30.6. ttf-lab cloud/train27_box.sh sets these per GPU.
# Validation rose in the 17 Oct runs at theta 16 and 64 (under investigation): not a settled recipe.
#   python -m ttf.train --recipe continue-27b --init-hf $W/qw27 --kd-cache $W/kd4s --resume --out-dir $W/run27
mode = "ttf"
convert = "gptq"
data = "data/mix4s_train.bin"
val = "data/wikiq8_val.bin"
data-dtype = "u32"
seq-len = 2048
batch-size = 2
accum = 8
kd-cache-start = 1350
kd-weight = 0.5
kd-cache-mode = "rest"
steps = 2650
warmup = 300
lr = 5e-4
min-lr = 5e-5
lr-rewarm = "1350:50:0.5"
eval-interval = 100
eval-iters = 4
save-secs = 3600
qk-temp = false
ttf-rank = 256
ttf-theta = 64
ttf-start = 400
ttf-vdiag = 50
ttf-store = "fp12s"
tail = "lean"
loss-chunk = 512
dw-sketch = 128
mem-cap-gib = 22.4
