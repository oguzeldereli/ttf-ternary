# Qwen3.8-27B (or another Qwen3.5 / 3.8) converted to ternary and trained on one 24 GB GPU (RTX 3090 Ti / 4090), 32k
# tokens per step (2 x 8 micro-batches of 2048): streaming GPTQ (one decoder layer in memory at a time), trits frozen for
# 400 steps while the floats calibrate, then TTF at theta 64, rank 256, 12-bit accumulator, KD from cached teacher top-k
# targets on the post-training mix (docs/CONVERT_27B.md: data, teacher cache, packing). The release qw27_rel (16 Oct;
# 1350 steps, the first 21 on labels, then this KD from mix2) scores 2.2439 packed on 8 Wikipedia windows (fp 1.9034).
# Speed on a 3090 Ti at these settings (measured on the continuation of qw27_rel): 68.9 s per step, peak 19.7 GB.
#   python -m ttf.train --recipe convert-27b --init-hf HF_DIR --kd-cache KD_DIR --out-dir runs/qw27
mode = "ttf"
convert = "gptq"
data = "data/mix3_train.bin"
val = "data/wikiq8_val.bin"
data-dtype = "u32"
seq-len = 2048
batch-size = 2
accum = 8
kd-weight = 0.5
kd-cache-mode = "rest"
kd-cache-start = 0
steps = 1350
warmup = 300
lr = 5e-4
min-lr = 5e-5
eval-interval = 100
eval-iters = 4
save-secs = 3600
qk-temp = false
ttf-rank = 256
ttf-theta = 64
ttf-start = 400
ttf-vdiag = 50
ttf-store = "fp12s"
tail = "lean"
loss-chunk = 512
dw-sketch = 128
mem-cap-gib = 22.4
